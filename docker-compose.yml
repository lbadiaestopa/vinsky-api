services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vinsky
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: vinsky
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - db
  
  frontend:
    build: ../vinsky-front
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
    name: sprint-5_db_data